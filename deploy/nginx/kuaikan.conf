# kuaikan 边缘代理配置（宿主机 nginx）
#
# 这是 ADR 0007 的显式例外：nginx 是唯一不跑在容器里的组件。
# 理由见 ADR 0007「宿主机 nginx 作为边缘代理」一节。
#
# 部署方式：
#   ./deploy/nginx/install.sh
#
# 上游约定：
#   gateway 容器只映射 127.0.0.1:8080，绝不对外发布端口。
#   SSE 端点 /api/notification/stream 必须关闭 proxy_buffering，且读超时远大于心跳（15s）。

# ---------- ACME 挑战 + HTTP 强制跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.katzenyasax.top katzenyasax.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.katzenyasax.top$request_uri;
    }
}

# ---------- 顶点域名 → www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name katzenyasax.top;

    ssl_certificate     /etc/letsencrypt/live/www.katzenyasax.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.katzenyasax.top/privkey.pem;

    return 301 https://www.katzenyasax.top$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.katzenyasax.top;

    ssl_certificate     /etc/letsencrypt/live/www.katzenyasax.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.katzenyasax.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 10m;

    # 前端静态产物由仓库构建后同步到此目录
    root /opt/kuaikan/frontend/dist;
    index index.html;

    # 探活端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SSE 长连接
    location /api/notification/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # API 反代到网关
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # P0 冒烟控制台（长期维护，页面在仓库 deploy/status/test/）
    location = /test {
        return 301 /test/;
    }

    location /test/ {
        root /opt/kuaikan/frontend;
        try_files $uri $uri/ /test/index.html;
        add_header Cache-Control "no-store" always;
    }

    # 静态资源：带 hash 的长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
