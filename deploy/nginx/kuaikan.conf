# kuaikan 边缘代理配置（宿主机 nginx）
#
# 这是 ADR 0007 的显式例外：nginx 是唯一不跑在容器里的组件。
# 理由见 ADR 0007「宿主机 nginx 作为边缘代理」一节。
#
# 部署方式：
#   ./deploy/nginx/install.sh
#
# 上游约定：
#   gateway 容器只映射 127.0.0.1:8080，绝不对外发布端口。
#   SSE 端点 /api/notification/stream 必须关闭 proxy_buffering，且读超时远大于心跳（15s）。

# ---------- ACME 挑战 + HTTP 强制跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name www.katzenyasax.top katzenyasax.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.katzenyasax.top$request_uri;
    }
}

# ---------- 顶点域名 → www ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name katzenyasax.top;

    ssl_certificate     /etc/letsencrypt/live/www.katzenyasax.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.katzenyasax.top/privkey.pem;

    return 301 https://www.katzenyasax.top$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.katzenyasax.top;

    ssl_certificate     /etc/letsencrypt/live/www.katzenyasax.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.katzenyasax.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 10m;

    # 前端静态产物由仓库构建后同步到此目录
    root /opt/kuaikan/frontend/dist;
    index index.html;

    # 探活端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SSE 长连接
    location /api/notification/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # API 反代到网关
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 静态资源：带 hash 的长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退。index.html 必须 no-cache —— 否则发布新版本后浏览器可能仍用旧入口，
    # 而旧的 hash 资源已被清理，表现为白屏。带 hash 的 /assets/ 才是长缓存。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# =============================================================================
# 【临时】纯 IP 访问 —— katzenyasax.top 处于 client hold 期间的应急通道
#
# BEGIN TEMP-IP-ACCESS
#
# 回滚（一条命令级别）：删除 BEGIN TEMP-IP-ACCESS 与 END TEMP-IP-ACCESS 之间
# 的全部内容，然后 nginx -t && systemctl reload nginx 即可恢复原状。
#
# 设计约束：
#   * 两个 server 块都用 server_name 精确匹配 IP，不设 default_server，
#     因此 www.katzenyasax.top / katzenyasax.top 的 80/443、TLS、ACME
#     行为完全不受影响（默认虚拟主机仍是上面的 ACME/跳转块）。
#   * 不新增任何 upstream 或端口，只反代 127.0.0.1:8080。
#   * 443 复用 www.katzenyasax.top 的现有证书：浏览器会提示证书域名不匹配，
#     用户选择「继续访问」后即可正常使用。
#   * 不变量 7：/internal/** 显式 404，后端非 8080 端口一律不暴露。
# =============================================================================

# ---------- 临时：纯 IP HTTP（直接出 SPA + API，不再 301 到域名） ----------
server {
    listen 80;
    listen [::]:80;
    server_name 206.237.30.147;

    root /opt/kuaikan/frontend/dist;
    index index.html;

    # 保留 ACME 路径：域名恢复后证书续期链路不变
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 不变量 7：内部端点绝不对外
    location ^~ /internal/ {
        return 404;
    }

    location /api/notification/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

