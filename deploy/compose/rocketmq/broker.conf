# kuaikan RocketMQ Broker（单 Master，容量基线下的唯一合理配置）
# 只用 Remoting 接入，不用 Proxy（ADR 0003 / architecture §3）。

brokerClusterName = KuaikanCluster
brokerName = broker-a
brokerId = 0

# 固定 IP：容器 IP 会随重建变化，必须钉死，否则客户端拿到失效地址
brokerIP1 = 172.30.10.14
listenPort = 10911
namesrvAddr = 172.30.10.13:9876

deleteWhen = 04
# 48 小时清理；commitlog 单文件降到 128MB，避免默认 1GB 预分配吃盘
fileReservedTime = 48
mapedFileSizeCommitLog = 134217728

brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog

# P0 允许自动建 Topic / 订阅组；P3 起改为显式创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 关闭 VIP 通道，减少无谓端口
enablePropertyFilter = false
