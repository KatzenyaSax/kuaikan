# kuaikan Redis 配置
# 密码不写在文件里，由 compose 的 --requirepass 命令行参数传入。

bind 0.0.0.0
protected-mode yes
port 6379

# 持久化：AOF + RDB 双开。
dir /data
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

# 内存上限：禁止淘汰。未读计数、jti 白名单被淘汰等于数据错误。
maxmemory 768mb
maxmemory-policy noeviction

slowlog-log-slower-than 10000
slowlog-max-len 256
timeout 0
tcp-keepalive 60

logfile ""
loglevel notice
