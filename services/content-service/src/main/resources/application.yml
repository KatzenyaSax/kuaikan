server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: content-service

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: ${APP_VERSION:dev}
    openfeign:
      client:
        config:
          default:
            # 发帖要同步问 community-service"是不是成员"。
            # **必须设超时**：Feign 默认没有读超时，下游卡住会把 content-service
            # 的线程池耗光 —— 故障从一个服务扩散成两个。
            connectTimeout: 500
            readTimeout: 500

  datasource:
    # 只连自己的 schema。u_content 只有 kuaikan_content.* 的权限（ADR 0006）
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/kuaikan_content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:u_content}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

kuaikan:
  mq:
    # 只用 Remoting 接入，不走 Proxy
    namesrv-addr: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  reconcile:
    # 计数对账周期。它兜住三类事件管不了的情况：
    # 事件超过重试上限被放弃、消费逻辑有 bug、有人手工改过计数
    interval: 10m

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    # 每个服务必须有独立的 worker-id（user=1 community=2 content=3）。
    # 容器内从 MAC/PID 推导不保证唯一，而 ID 冲突要等到写入时才暴露。
    worker-id: ${ID_WORKER_ID:3}
    datacenter-id: ${ID_DATACENTER_ID:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: content-service

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    # 刻意放在 /internal 前缀下：与 architecture §10 不变量 7 一致，
    # 网关不得路由 /internal/**，因此这份契约只在容器网络内可见。
    path: /internal/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  packages-to-scan: top.katzenyasax.kuaikan.content
  show-actuator: false
