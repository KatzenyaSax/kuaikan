server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: user-service

  # 配置中心：register-enabled 等开关要能热切换。
  # optional: 前缀保证 Nacos 不可用时不阻塞启动（P1.1 阶段优先保证可启动）。
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: ${APP_VERSION:dev}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

  datasource:
    # 只连自己的 schema。u_user 只有 kuaikan_user.* 的权限（ADR 0006）
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/kuaikan_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:u_user}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    # 显式分配：容器内从 MAC/PID 推导 workerId 不保证唯一，而 ID 冲突
    # 要等到写入时才暴露。每个服务在 compose 里给不同的值。
    worker-id: ${ID_WORKER_ID:1}
    datacenter-id: ${ID_DATACENTER_ID:1}

kuaikan:
  internal:
    auth:
      # 网关→服务的内部签名密钥，与网关的 kuaikan.auth.internal-secret 一致
      secret: ${INTERNAL_AUTH_SECRET:}
  mq:
    # 只用 Remoting 接入（ADR 0003 / architecture §3），不走 Proxy
    namesrv-addr: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  auth:
    # RSA 密钥目录。落在挂载卷上，重启/重建容器后 kid 不变，
    # 否则所有已签发 token 会在重启时全部失效。
    key-dir: ${AUTH_KEY_DIR:/app/keys}
    # 注册默认关闭。真值放 Nacos 配置中心，验收脚本会热切换（见 p1-auth.md）
    register-enabled: ${AUTH_REGISTER_ENABLED:false}
    code-ttl: 10m
    code-length: 6
    code-max-attempts: 5
    code-resend-interval: 60s
    code-ip-hourly-limit: 10
  mail:
    from: ${MAIL_FROM:no-reply@katzenyasax.top}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: user-service

springdoc:
  api-docs:
    # 刻意放在 /internal 前缀下：与 architecture §10 不变量 7 一致，
    # 网关不得路由 /internal/**，因此这份契约只在容器网络内可见。
    path: /internal/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  packages-to-scan: top.katzenyasax.kuaikan.user
  show-actuator: false

logging:
  level:
    root: INFO
