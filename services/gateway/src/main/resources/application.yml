server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway

  # 网关是唯一验签点，需要 Redis 查 access 白名单（"立刻失效"依赖它）
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/community/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**
              filters:
                - StripPrefix=2
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/api/interaction/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=2
            - id: rank-service
              uri: lb://rank-service
              predicates:
                - Path=/api/rank/**
              filters:
                - StripPrefix=2

kuaikan:
  auth:
    # 公钥来源。同容器网络内直接用服务名，比走 lb:// 简单且少一跳。
    jwks-uri: ${JWKS_URI:http://user-service:8081/internal/jwks}
    # 精确放行：登录前必然未认证的端点
    # 条目格式：<METHOD> <路径>。方法位写 * 表示任意方法。
    # **必须带方法**：同一路径常常读公开、写需要登录
    # （/communities 的 GET 游客可读、POST 需要登录；P2.3 的 /posts 同理）。
    whitelist:
      - POST /api/user/auth/login
      - POST /api/user/auth/register
      - POST /api/user/auth/register/code
      - POST /api/user/auth/refresh
      # P2：社群列表游客可读（仅 GET）
      - GET /api/community/communities
      # P2.3：批量作者摘要（帖子列表显示作者昵称头像用）
      - GET /api/user/users
      # P6.3：全站搜索游客可读。搜索是「把公开内容带出去」，与浏览列表同性质。
      # P6.0 时 search-service 还没有 /posts，先放在 public-patterns 避免规则先于实现；
      # 端点就位后挪回这里，接受 check-openapi 的存在性校验（路径与方法都被钉死，
      # /api/search/posts/xxx 与写方法都不会被顺带放行）。
      - GET /api/search/posts
    # 正则放行：P0/P0.5 的探针端点，不返回任何用户数据。
    # 这是 P1 的已知债务，见 docs/project.md「P0 期间已知的公开面」。
    public-patterns:
      - '* ^/api/[^/]+/ping(/.*)?$'
      # P2：社群详情按名称取，路径里是变量，只能正则放行。
      # 两条限制叠加：只放行 GET，且只放行"最后一段是名称"的形状。
      # 少任何一条，/communities/{name}/membership 这类写端点都会被放行。
      - GET ^/api/community/communities/[^/]+$
      # P2.4：帖子列表游客可读。精确路径 -> 只有 GET /posts 这一条，
      # 不会波及 /posts/{id}（那条另有正则）
      - GET /api/content/posts
      # P3.3：首页"最新帖子"（跨社群）。字面量路径，不会被帖子详情的数字正则误伤
      - GET ^/api/content/posts/latest$
      # P2.3：帖子详情游客可读。刻意只认**数字 id**：
      # 帖子 id 是雪花数字，用 [0-9]+ 把路径形状钉死，
      # 将来在 /posts/ 下加写端点不会被这条顺带放行。
      - GET ^/api/content/posts/[0-9]+$
      # P3：评论区游客可读。同样只认数字 id，把路径形状钉死。
      - GET ^/api/content/posts/[0-9]+/comments$
      - GET ^/api/content/comments/[0-9]+/replies$
      # P5.0：分享计数。**游客可分享**，与点赞/收藏不同——
      # 分享是"把内容带出去"，不该要求登录。
      # 与详情那条一样把路径形状钉死（数字 id + 字面量 share 尾巴），
      # 将来在 /posts/{id}/ 下加写端点不会被顺带放行。
      - POST ^/api/content/posts/[0-9]+/share$
      # P5.2：热榜游客可读。字面量路径，不会被其他规则误伤
      - GET /api/rank/hot
      # P5.5：用户主页只读三件套（profile / following / followers）。
      # 用户主页全量对游客公开（docs/design/p55-social.md §3.6）。
      # 三条都用 [^/]+ 把路径形状钉死：只能匹配「/users/{id}/<字面量尾巴>」，
      # 不会顺带放行 /users/{id}/follow（写路径）或 /me/following/ids。
      # 只放行 GET：关注/取关是 POST/DELETE，不在这三条的覆盖范围内。
      - GET ^/api/user/users/[^/]+/profile$
      - GET ^/api/user/users/[^/]+/following$
      - GET ^/api/user/users/[^/]+/followers$
      # P5.5：用户已加入的社群列表，随用户主页对游客公开。
      # 路径首段是字面量 users，与 /communities/... 系列完全错开。
      - GET ^/api/community/users/[^/]+/communities$
      # P7.0：社群历史（编年史）与历代管理员脉络对游客公开。
      # 两条都只放行 GET，且用 [^/]+ 把路径形状钉死：
      # 只能匹配「/communities/{name}/history」与「/communities/{name}/admins/history」，
      # 不会顺带放行这些 P7 写/管理端点：
      #   GET  /api/community/communities/{name}/my-status
      #   PUT  /api/community/communities/{name}
      #   POST /api/community/communities/{name}/transfer
      #   GET  /api/community/communities/{name}/members
      #   GET  /api/community/communities/{name}/bans
      #   POST /api/community/communities/{name}/bans
      #   DELETE /api/community/communities/{name}/bans/{userId}
      # 以上一律需要登录。
      - GET ^/api/community/communities/[^/]+/history$
      - GET ^/api/community/communities/[^/]+/admins/history$
      # 以下 P5.5 端点**一律需要登录，绝不进白名单**：
      #   POST/DELETE /api/user/users/{id}/follow、POST /api/user/auth/password、
      #   GET /api/user/follows/states、GET /api/user/me/following/ids、
      #   POST /api/content/posts/by-authors、POST /api/content/posts/batch、
      #   GET /api/interaction/favorites

management:
  endpoints:
    web:
      exposure:
        # gateway 端点用于确认路由是否真的被绑定（P0 验收）
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: gateway
    runtime: webflux

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
