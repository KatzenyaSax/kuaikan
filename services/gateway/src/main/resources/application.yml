server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway

  # 网关是唯一验签点，需要 Redis 查 access 白名单（"立刻失效"依赖它）
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/community/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**
              filters:
                - StripPrefix=2
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/api/interaction/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=2
            - id: rank-service
              uri: lb://rank-service
              predicates:
                - Path=/api/rank/**
              filters:
                - StripPrefix=2

kuaikan:
  auth:
    # 公钥来源。同容器网络内直接用服务名，比走 lb:// 简单且少一跳。
    jwks-uri: ${JWKS_URI:http://user-service:8081/internal/jwks}
    # 精确放行：登录前必然未认证的端点
    # 条目格式：<METHOD> <路径>。方法位写 * 表示任意方法。
    # **必须带方法**：同一路径常常读公开、写需要登录
    # （/communities 的 GET 游客可读、POST 需要登录；P2.3 的 /posts 同理）。
    whitelist:
      - POST /api/user/auth/login
      - POST /api/user/auth/register
      - POST /api/user/auth/register/code
      - POST /api/user/auth/refresh
      # P2：社群列表游客可读（仅 GET）
      - GET /api/community/communities
      # P2.3：批量作者摘要（帖子列表显示作者昵称头像用）
      - GET /api/user/users
    # 正则放行：P0/P0.5 的探针端点，不返回任何用户数据。
    # 这是 P1 的已知债务，见 docs/project.md「P0 期间已知的公开面」。
    public-patterns:
      - '* ^/api/[^/]+/ping(/.*)?$'
      # P2：社群详情按名称取，路径里是变量，只能正则放行。
      # 两条限制叠加：只放行 GET，且只放行"最后一段是名称"的形状。
      # 少任何一条，/communities/{name}/membership 这类写端点都会被放行。
      - GET ^/api/community/communities/[^/]+$
      # P2.3：帖子详情游客可读。刻意只认**数字 id**：
      # 帖子 id 是雪花数字，用 [0-9]+ 把路径形状钉死，
      # 将来在 /posts/ 下加写端点不会被这条顺带放行。
      - GET ^/api/content/posts/[0-9]+$

management:
  endpoints:
    web:
      exposure:
        # gateway 端点用于确认路由是否真的被绑定（P0 验收）
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: gateway
    runtime: webflux

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
