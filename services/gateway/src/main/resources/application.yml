server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/community/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**
              filters:
                - StripPrefix=2
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/api/interaction/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=2
            - id: rank-service
              uri: lb://rank-service
              predicates:
                - Path=/api/rank/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        # gateway 端点用于确认路由是否真的被绑定（P0 验收）
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: gateway
    runtime: webflux

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
