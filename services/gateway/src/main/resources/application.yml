server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway

  # 网关是唯一验签点，需要 Redis 查 access 白名单（"立刻失效"依赖它）
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
            - id: community-service
              uri: lb://community-service
              predicates:
                - Path=/api/community/**
              filters:
                - StripPrefix=2
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**
              filters:
                - StripPrefix=2
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/api/interaction/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=2
            - id: rank-service
              uri: lb://rank-service
              predicates:
                - Path=/api/rank/**
              filters:
                - StripPrefix=2

kuaikan:
  auth:
    # 公钥来源。同容器网络内直接用服务名，比走 lb:// 简单且少一跳。
    jwks-uri: ${JWKS_URI:http://user-service:8081/internal/jwks}
    # 精确放行：登录前必然未认证的端点
    whitelist:
      - /api/user/auth/login
      - /api/user/auth/register
      - /api/user/auth/register/code
      - /api/user/auth/refresh
    # 正则放行：P0/P0.5 的探针端点，不返回任何用户数据。
    # 这是 P1 的已知债务，见 docs/project.md「P0 期间已知的公开面」。
    public-patterns:
      - ^/api/[^/]+/ping(/.*)?$

management:
  endpoints:
    web:
      exposure:
        # gateway 端点用于确认路由是否真的被绑定（P0 验收）
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      access: read_only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: gateway
    runtime: webflux

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
