server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: search-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: ${APP_VERSION:dev}
    openfeign:
      client:
        config:
          default:
            # 消费事件/重建时要向 content、user、community 补齐反范式字段。
            # 这是后台路径，不是用户请求——超时短一点：失败就重投或整次重建重来，
            # 比让 MQ 消费线程挂在半分钟好。
            connectTimeout: 800
            readTimeout: 1500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: search-service

logging:
  level:
    root: INFO

kuaikan:
  mq:
    # 只用 Remoting 接入，不走 Proxy（与 notification / content 一致）
    namesrv-addr: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  search:
    # ES 纯内网、无认证。它只是派生存储：**没有 datasource**，也不依赖 ES
    # 才能通过 readiness（ES 挂了本服务必须仍存活并返回受控降级）
    elasticsearch-uri: ${ELASTICSEARCH_URI:http://127.0.0.1:9200}
    connect-timeout: 3s
    # 重建的 _bulk 一次 500 条，读超时不能给 1s
    read-timeout: 10s
    # 重建时每页拉 200（content 侧上限 500，默认也是 200）
    rebuild-page-size: 200
    bulk-size: 500
    # 三个消费组**必须互不相同**：RocketMQ 里 group 才代表“我是谁”，
    # 同一个 group 订阅同一个 topic 是负载均衡（各拿一半），不是广播。
    post-created-consumer-group: kuaikan-search-post-created-consumer
    post-deleted-consumer-group: kuaikan-search-post-deleted-consumer
    user-updated-consumer-group: kuaikan-search-user-updated-consumer
    # P9 向量切片独立消费组（与 P6 关键词索引解耦，TEI 挂了不影响 P6 搜索）
    post-vector-created-consumer-group: kuaikan-search-post-vector-created-consumer
    post-vector-deleted-consumer-group: kuaikan-search-post-vector-deleted-consumer
    note-vector-changed-consumer-group: kuaikan-search-note-vector-changed-consumer
    # P9.0 Embedding 推理（OpenAI 兼容 /v1/embeddings，默认指向内网 TEI）
    embedding:
      base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:8089}
      model: ${EMBEDDING_MODEL:BAAI/bge-small-zh-v1.5}
      api-key: ${EMBEDDING_API_KEY:}
      connect-timeout: 3s
      read-timeout: 15s
      batch-size: 16
      rrf-k: 60
      related-min-score: 0.78

springdoc:
  api-docs:
    # 刻意放在 /internal 前缀下：与 architecture §10 不变量 7 一致，
    # 网关不得路由 /internal/**，因此这份契约只在容器网络内可见。
    path: /internal/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  packages-to-scan: top.katzenyasax.kuaikan.search
  show-actuator: false
