server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: community-service
  datasource:
    # 只连自己的 schema。u_community 只有 kuaikan_community.* 的权限（ADR 0006）
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/kuaikan_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:u_community}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: ${APP_VERSION:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    # 与 user-service 用不同的 worker-id：容器内从 MAC/PID 推导不保证唯一，
    # 而 ID 冲突要等到写入时才暴露
    worker-id: ${ID_WORKER_ID:2}
    datacenter-id: ${ID_DATACENTER_ID:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: community-service

logging:
  level:
    root: INFO

kuaikan:
  mq:
    # 只用 Remoting 接入（ADR 0003 / architecture §3），不走 Proxy
    namesrv-addr: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}

springdoc:
  api-docs:
    # 刻意放在 /internal 前缀下：与 architecture §10 不变量 7 一致，
    # 网关不得路由 /internal/**，因此这份契约只在容器网络内可见。
    path: /internal/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  packages-to-scan: top.katzenyasax.kuaikan.community
  show-actuator: false
